# NOTES:
# Rootless docker doesn't really work due to UID mapping issues
# There's a bug with podman container manager where whitespace in files in root directory can cause an error
# Install crun on host to avoid rootless podman permissions
# distrobox-host-exec does not work when executed from anywhere on host filesystem for some reason
#
# TODO:
# Package desktop env (i3 or hyprland)?
#
# To build locally:
# podman build -t sdbox .
#
# To start up the container:
# distrobox assemble
#
# To get a shell in the container:
# distrobox enter sdbox
#
# To shut down the container:
# distrobox rm

[sdbox]
image=ghcr.io/scott-carrion/sdbox:latest
init=true
start_now=true
home="/home/sdbox"

## User configuration ##

# Create symlinks for user config files into /opt/sdbox/usr area
# To avoid recursive creation of directory symlinks, we do a check-then-link
# For regular files this does not apply
init_hooks="if [ ! -e /home/sdbox/.config ]; then ln -sf /opt/sdbox/dots/config ~/.config; fi"
init_hooks="if [ ! -e /home/sdbox/.config/emacs ]; then ln -sf /opt/sdbox/usr/emacs ~/.config/emacs; fi"
init_hooks="ln -sf /opt/sdbox/dots/bashrc ~/.bashrc"
init_hooks="ln -sf /opt/sdbox/dots/vimrc ~/.vimrc"
init_hooks="ln -sf /opt/sdbox/dots/xbindkeysrc ~/.xbindkeysrc"
init_hooks="if [ ! -e /home/sdbox/.tmux ]; then ln -sf /opt/sdbox/usr/tmux ~/.tmux; fi"
init_hooks="if [ ! -e /home/sdbox/.ssh ]; then ln -sf ${HOME}/.ssh ~/.ssh; fi"

# Create symlinks for commands to execute on the host
# This allows sdbox to build and manipulate containers via host
# (No need for recursive docker/podman)
init_hooks="ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman"
init_hooks="ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/docker"

# Ensure user ownership of home directory
init_hooks="chown -R $(id -u):$(id -g) /home/sdbox"

