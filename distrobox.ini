# NOTES:
# There's a bug with podman container manager where whitespace in files in root directory can cause an error
# Install crun on host to avoid rootless podman permissions
[sdbox]
image=sdbox:latest
#image=quay.io/toolbx-images/debian-toolbox:13
init=true
start_now=true
home="/home/sdbox"
#root=true
init_hooks="chown -R $(id -u):$(id -g) /opt/sdbox"
# TODO: GNU STORE THIS
init_hooks="mkdir -p ~/.config"
init_hooks="ln -sf /opt/sdbox/emacs ~/.config/emacs"
init_hooks="emacs --batch -l /opt/sdbox/doom-post-install.el"
